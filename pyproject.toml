[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-lighting"
# PEP 440 spelling of manifest.json's "2.5.0-cdit.1" (keep the two in step)
version = "2.5.0+cdit.1"
description = "Automatically adjust brightness and color of lights based on the sun position"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "ruff",
]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-homeassistant-custom-component",
]

[tool.hatch.build.targets.wheel]
packages = ["custom_components/adaptive_lighting"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
